<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg-0:{{C_BG0}};
    --bg-1:{{C_BG1}};
    --bg-2:#FFFFFF;
    --bg-3:{{C_BG3}};
    --ink:{{C_INK}};
    --ink-dim:{{C_INK_DIM}};
    --turquoise:{{C_TURQ}};
    --turquoise-deep:{{C_TURQ_DEEP}};
    --sea:{{C_SEA}};
    --sea-deep:{{C_SEA_DEEP}};
    --line:rgba({{C_INK_RGB}},0.12);
    --muted:{{C_MUTED}};
    --shadow: 0 20px 50px -22px rgba({{C_INK_RGB}},0.20);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Assistant', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  ::selection{ background:var(--turquoise); color:var(--bg-0); }
  .mono{ font-family:'IBM Plex Mono', monospace; direction:ltr; unicode-bidi:embed; letter-spacing:0.02em; }
  h1,h2,h3,.display{ font-family:'Secular One', sans-serif; font-weight:400; }
  .eyebrow{
    font-size:0.78rem; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--turquoise-deep); font-weight:600; margin-bottom:14px; display:block;
  }
  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  /* ---------- progress rail ---------- */
  #rail{
    position:fixed; top:0; right:0; height:100%; width:4px; z-index:50;
    background:var(--line);
  }
  #rail-fill{ width:100%; height:0%; background:linear-gradient(var(--turquoise), var(--sea)); transition:height .1s linear; }

  /* ---------- layout helpers ---------- */
  .wrap{ max-width:960px; margin:0 auto; padding:0 28px; }
  section{ position:relative; }
  .pad{ padding:120px 0; }
  @media(max-width:640px){ .pad{ padding:80px 0; } .wrap{ padding:0 20px; } }

  /* ---------- HERO ---------- */
  #hero{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
    text-align:center; position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse at 30% 20%, rgba({{C_TURQ_RGB}},0.14), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba({{C_SEA_RGB}},0.12), transparent 55%),
      var(--bg-0);
  }
  #hero .swell{
    position:absolute; inset:0; opacity:.5; pointer-events:none;
  }
  #hero .eyebrow{ position:relative; z-index:2; }
  #hero h1{
    position:relative; z-index:2;
    font-size:clamp(3rem, 9vw, 7rem); line-height:0.98; color:var(--ink);
    margin-bottom:18px;
  }
  #hero h1 em{ font-style:italic; color:var(--turquoise); }
  #hero .sub{
    position:relative; z-index:2; color:var(--ink-dim); font-size:1.15rem; max-width:520px; margin:0 auto;
  }
  #hero .meta-row{
    position:relative; z-index:2; margin-top:46px; display:flex; gap:34px; flex-wrap:wrap; justify-content:center;
  }
  #hero .meta-row div{ text-align:center; }
  #hero .meta-row .n{ font-family:'Secular One',sans-serif; font-size:1.6rem; color:var(--sea); }
  #hero .meta-row .l{ font-size:0.78rem; color:var(--muted); letter-spacing:0.06em; }
  .scrolldown{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%); z-index:2;
    width:1px; height:50px; background:linear-gradient(var(--turquoise), transparent);
  }

  /* ---------- MAP (signature element) — real, live OpenStreetMap tiles via Leaflet ---------- */
  .map-wrap{
    display:flex; justify-content:center; margin:36px auto 0; max-width:640px;
  }
  .realmap{
    position:relative; width:100%; height:300px; border-radius:16px; overflow:hidden;
    border:1px solid var(--line); box-shadow:var(--shadow); background:var(--bg-2);
  }
  .realmap .leaflet-container{ background:var(--bg-2); font-family:'Assistant',sans-serif; }
  .realmap .leaflet-tile-pane{
    filter: saturate(0.9) brightness(1.02);
  }
  .realmap .leaflet-control-attribution{
    background:rgba(255,255,255,.75); color:var(--ink-dim); font-size:9px;
  }
  .realmap .leaflet-control-attribution a{ color:var(--ink-dim); }
  .map-fallback-note{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:20px; color:var(--muted); font-size:0.85rem; z-index:0;
  }
  /* map labels are divIcon markers pinned to the coordinate; a CSS transform offsets
     the pill by its own rendered width, so placement is correct no matter when the
     web font finishes loading (the browser re-resolves calc(-100%) on reflow) */
  .map-label-icon{ background:none!important; border:none!important; width:0!important; height:0!important; overflow:visible!important; }
  .map-label{
    position:absolute; top:0; left:0; white-space:nowrap; pointer-events:none;
    background:rgba(255,255,255,.9); border:1px solid var(--line); color:var(--ink-dim);
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 8px; border-radius:6px;
  }
  .map-label.lbl-top  { transform:translate(-50%, calc(-100% - 11px)); }
  .map-label.lbl-right{ transform:translate(12px, -50%); }
  .map-label.lbl-left { transform:translate(calc(-100% - 12px), -50%); }
  .map-label.active{ color:var(--ink); border-color:var(--turquoise); font-weight:600; }
  .veh-icon{ pointer-events:none; }
  .veh-icon .veh-svg{ display:block; filter:drop-shadow(0 0 4px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.4)); transition:transform .08s linear; }

  /* ---------- fog marker (drama map) ---------- */
  .fog-icon{ pointer-events:none; }
  .fog-badge{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-size:22px; line-height:1; color:#5b7c7f;
    filter:drop-shadow(0 0 10px rgba(255,255,255,.95));
    animation:fogpulse 2.6s ease-in-out infinite;
  }
  .fog-badge span{
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--ink-dim);
    background:rgba(255,255,255,.82); padding:1px 6px; border-radius:5px;
  }
  @keyframes fogpulse{ 0%,100%{ opacity:.5; transform:scale(.9); } 50%{ opacity:1; transform:scale(1.08); } }

  /* ---------- route legs — layout-controlled direction (origin → destination, always) ---------- */
  .leg{ display:inline-flex; align-items:center; gap:.45em; flex-wrap:wrap; justify-content:center; direction:rtl; }
  .leg > span{ unicode-bidi:isolate; }
  .leg .leg-arrow{ color:var(--turquoise-deep); font-weight:400; opacity:.7; }
  .route .leg{ font-family:'IBM Plex Mono',monospace; font-size:.95em; }
  .route .route-sep{ margin:0 .5em; opacity:.5; }

  /* ---------- TRANSIT sections ---------- */
  .transit{
    padding:96px 0; text-align:center; background:var(--bg-1);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .transit .kicker{ color:var(--muted); font-size:0.85rem; }
  .transit h2{ font-size:clamp(1.8rem,4vw,2.6rem); margin:8px 0 4px; }
  .transit .route{ color:var(--ink-dim); font-size:1.05rem; }
  .transit .note{ margin-top:18px; color:var(--muted); font-size:0.92rem; max-width:480px; margin-inline:auto; }

  /* ---------- DRAMA section ---------- */
  #drama{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(196,90,74,0.12), transparent 60%),
      var(--bg-0);
    padding:130px 0; text-align:center; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  #drama .eyebrow{ color:#C1584A; }
  /* smaller than a normal headline + nowrap so the there-and-back route stays on one line */
  #drama h2{ font-size:clamp(1rem, 4.6vw, 2.6rem); max-width:720px; margin:0 auto 22px; }
  #drama h2 .leg{ flex-wrap:nowrap; white-space:nowrap; gap:.32em; }
  #drama p{ max-width:560px; margin:0 auto 14px; color:var(--ink-dim); font-size:1.05rem; }
  #drama .badge{
    display:inline-block; margin-top:26px; padding:10px 22px; border:1px solid rgba(193,88,74,.45);
    border-radius:999px; color:#C1584A; font-size:0.85rem; letter-spacing:.03em;
  }

  /* ---------- STAY sections ---------- */
  .stay{ padding:110px 0; }
  .stay:nth-of-type(even){ background:var(--bg-1); }
  /* layover reuses .stay layout but has no lodging card; pin its background so it
     doesn't depend on nth-of-type parity */
  .stay.layover{ background:var(--bg-1); }
  .stay.layover .isl{ color:var(--turquoise-deep); }
  .stay-head{ margin-bottom:16px; }
  .stay-head .isl{ color:var(--sea); font-size:0.9rem; letter-spacing:.08em; text-transform:uppercase; }
  .stay h2{ font-size:clamp(2.1rem,5vw,3.2rem); margin:6px 0; }
  /* date is its own right-aligned line above the place name; inline-block keeps the
     LTR numerals correct without left-aligning the block */
  .stay .dates{ display:inline-block; font-family:'IBM Plex Mono',monospace; direction:ltr; unicode-bidi:embed; color:var(--muted); font-size:0.88rem; white-space:nowrap; margin-bottom:8px; }
  .stay .lede{ color:var(--ink-dim); max-width:640px; margin-bottom:26px; font-size:1.05rem; }

  /* "did you know" background note about the place */
  .about{
    max-width:640px; margin-bottom:34px; padding:16px 20px; font-size:0.98rem; line-height:1.75;
    color:var(--ink-dim); background:var(--bg-3); border-radius:14px;
    border-inline-start:3px solid var(--turquoise);
  }
  .about .about-k{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
    letter-spacing:.14em; text-transform:uppercase; color:var(--turquoise-deep); margin-bottom:6px;
  }

  .lodging-card{
    display:flex; gap:22px; align-items:center; background:var(--bg-2); border:1px solid var(--line);
    border-radius:18px; padding:20px 24px; margin-bottom:38px; flex-wrap:wrap;
  }
  .lodging-card .ic{ font-size:1.6rem; }
  .lodging-card .info b{ display:block; font-size:1.05rem; margin-bottom:2px; }
  .lodging-card .info span{ color:var(--muted); font-size:0.88rem; }
  .lodging-card .info .host-link{
    display:block; font-size:1.05rem; margin-bottom:2px; font-weight:600;
    color:var(--turquoise-deep); text-decoration:none; border-bottom:1px solid rgba({{C_TURQ_RGB}},.35);
  }
  .lodging-card .info .host-link:hover{ border-bottom-color:var(--turquoise-deep); }
  .lodging-card .code{ margin-inline-start:auto; font-family:'IBM Plex Mono',monospace; direction:ltr; color:var(--turquoise-deep); font-size:0.82rem; background:rgba({{C_TURQ_RGB}},.10); padding:6px 12px; border-radius:8px; }

  .gallery-label{
    color:var(--muted); font-size:0.78rem; letter-spacing:.06em; text-transform:uppercase;
    margin:22px 0 10px;
  }
  .gallery-label:first-of-type{ margin-top:0; }

  .gallery{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px; margin-bottom:36px;
  }
  .ph{
    aspect-ratio:4/5; border-radius:12px; border:1.5px dashed var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    color:var(--muted); font-size:0.78rem; background:linear-gradient(160deg, var(--bg-2), var(--bg-1));
    text-align:center; padding:8px;
  }
  .ph .icon{ font-size:1.4rem; opacity:.6; }
  .ph.img-set{ border-style:solid; overflow:hidden; padding:0; }
  .ph.img-set img{ width:100%; height:100%; object-fit:cover; }

  .tags{ display:flex; flex-wrap:wrap; gap:10px; }
  .tag{
    border:1px solid var(--line); border-radius:999px; padding:9px 18px; font-size:0.88rem;
    background:var(--bg-2); color:var(--ink-dim);
  }
  .tag b{ color:var(--ink); font-weight:600; }

  /* ---------- FOOTER ---------- */
  #outro{
    padding:150px 0 110px; text-align:center;
    background:radial-gradient(ellipse at 50% 100%, rgba({{C_SEA_RGB}},0.12), transparent 60%), var(--bg-0);
  }
  #outro h2{ font-size:clamp(2.4rem,6vw,4rem); margin-bottom:18px; }
  #outro p{ color:var(--ink-dim); max-width:520px; margin:0 auto; }
  #outro .stat-row{ display:flex; justify-content:center; gap:40px; margin-top:50px; flex-wrap:wrap; }
  #outro .stat-row .n{ font-family:'Secular One',sans-serif; font-size:2.2rem; color:var(--turquoise); }
  #outro .stat-row .l{ font-size:0.8rem; color:var(--muted); }

  /* ---------- ECONOMICS ---------- */
  #economics{
    padding:120px 0; background:var(--bg-1);
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  #economics .eyebrow{ color:var(--sea-deep); }
  #economics h2{ font-size:clamp(2rem,5vw,3rem); margin:6px 0 12px; }
  #economics .intro{ color:var(--ink-dim); max-width:620px; font-size:1.05rem; margin-bottom:42px; }
  .fin-big{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:46px; }
  .fin-big .bn{
    flex:1 1 190px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:16px; padding:20px 22px;
  }
  .fin-big .bn .v{ font-family:'Secular One',sans-serif; font-size:1.9rem; color:var(--turquoise-deep); line-height:1.1; }
  .fin-big .bn .k{ color:var(--muted); font-size:0.84rem; margin-top:6px; }
  .fin-bars{ max-width:680px; margin-bottom:46px; }
  .fin-bars .row{ margin-bottom:15px; }
  .fin-bars .bh{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.92rem; margin-bottom:5px; }
  .fin-bars .bh .amt{ font-family:'IBM Plex Mono',monospace; direction:ltr; unicode-bidi:embed; color:var(--muted); font-size:0.86rem; }
  .fin-bars .track{ height:12px; background:var(--bg-3); border-radius:999px; overflow:hidden; }
  .fin-bars .fill{ height:100%; background:linear-gradient(270deg, var(--turquoise), var(--sea)); border-radius:999px; }
  .fin-notes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
  .fin-notes .fn{
    background:var(--bg-2); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; font-size:0.95rem; color:var(--ink-dim); line-height:1.7;
  }
  .fin-notes .fn b{ color:var(--ink); font-weight:600; }
  .fin-notes .fn .fn-k{
    display:block; font-family:'IBM Plex Mono',monospace; font-size:0.68rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--sea-deep); margin-bottom:6px;
  }
  .fin-foot{ margin-top:34px; color:var(--muted); font-size:0.85rem; max-width:620px; }
</style>
</head>
<body dir="rtl">

<div id="rail"><div id="rail-fill"></div></div>

<!-- ================= HERO ================= -->
<section id="hero">
  <svg class="swell" viewBox="0 0 1200 800" preserveAspectRatio="none">
    <path d="M0,600 Q300,560 600,600 T1200,600" stroke="rgba({{C_TURQ_RGB}},.35)" stroke-width="2" fill="none"/>
    <path d="M0,660 Q300,630 600,660 T1200,660" stroke="rgba({{C_SEA_RGB}},.28)" stroke-width="2" fill="none"/>
  </svg>
  <span class="eyebrow">{{HERO_EYEBROW}}</span>
  <h1>{{HERO_H1}}</h1>
  <p class="sub">{{HERO_SUB}}</p>
  <div class="meta-row">
{{HERO_META}}
  </div>
  <div class="scrolldown"></div>
</section>

<!-- content is rendered here by JS -->
<div id="app"></div>

<!-- ================= OUTRO ================= -->
<section id="outro">
  <div class="wrap">
    <span class="eyebrow">{{OUTRO_EYEBROW}}</span>
    <h2>{{OUTRO_H2}}</h2>
    <p>{{OUTRO_P}}</p>
    <div class="stat-row">
{{OUTRO_STATS}}
    </div>
  </div>
</section>

<!-- ================= ECONOMICS (bonus appendix) ================= -->
<section id="economics">
  <div class="wrap">
    <span class="eyebrow">{{ECON_EYEBROW}}</span>
    <h2>{{ECON_H2}}</h2>
    <p class="intro">{{ECON_INTRO}}</p>

    <div class="fin-big">
{{ECON_BIG}}
    </div>

    <div class="fin-bars">
{{ECON_BARS}}
    </div>

    <div class="fin-notes">
{{ECON_NOTES}}
    </div>

    <p class="fin-foot">{{ECON_FOOT}}</p>
  </div>
</section>

<script>
/* =========================================================
   DATA MODEL
   Photos are external files in images/ (see PHOTOS below).
   Empty arrays render as placeholders.
   ========================================================= */

// All trip content below is injected by build_trip.py from trip_spec.json.
// real-world coordinates (lat, lon) keyed by short id
const LOCATIONS = {{LOCATIONS_JSON}};

// Photos live in the images/ folder next to this file.
//   lodging -> images/lodging/<key>-N.jpg   |   trip -> images/trips/<key>-N.jpg
// Empty arrays render as placeholder tiles.
const PHOTOS = {{PHOTOS_JSON}};

// quadratic-bezier interpolation between two lat/lon points (with a control point for a gentle arc)
function curvePoints(from, to, bend, n){
  const mLat = (from.lat+to.lat)/2 + bend, mLon = (from.lon+to.lon)/2;
  const pts = [];
  for(let i=0;i<=n;i++){
    const t = i/n;
    const lat = (1-t)*(1-t)*from.lat + 2*(1-t)*t*mLat + t*t*to.lat;
    const lon = (1-t)*(1-t)*from.lon + 2*(1-t)*t*mLon + t*t*to.lon;
    pts.push([lat, lon]);
  }
  return pts;
}

// Both icons are drawn nose/bow pointing +X (east); playRoute rotates them to the heading.
const PLANE_SVG = `<svg class="veh-svg" width="32" height="32" viewBox="-14 -14 28 28"><path d="M13,0 L4.5,-1.5 L2.5,-1.8 L-2.5,-10 L-4,-10 L-3.5,-2 L-8,-1.6 L-9,-4.6 L-10.4,-4.6 L-10.8,-1.3 L-12,-0.8 L-12,0.8 L-10.8,1.3 L-10.4,4.6 L-9,4.6 L-8,1.6 L-3.5,2 L-4,10 L-2.5,10 L2.5,1.8 L4.5,1.5 Z" fill="{{C_INK}}"/></svg>`;
const FERRY_SVG = `<svg class="veh-svg" width="32" height="32" viewBox="-16 -16 32 32"><path d="M-12,-2 L10,-2 L14.5,0.4 L9.5,2.9 L-10.5,2.9 L-12,0.7 Z M-8,-2 L-8,-7.4 L3.4,-7.4 L3.4,-4.7 L6.8,-4.7 L6.8,-2 Z M-6,-7.4 L-6,-10.6 L-3,-10.6 L-3,-7.4 Z" fill="{{C_SEA_DEEP}}"/><g fill="#EAF3F5"><rect x="-9.2" y="-0.1" width="1.7" height="1.7"/><rect x="-5.7" y="-0.1" width="1.7" height="1.7"/><rect x="-2.2" y="-0.1" width="1.7" height="1.7"/><rect x="1.3" y="-0.1" width="1.7" height="1.7"/><rect x="-6.6" y="-5.8" width="1.5" height="1.5"/><rect x="-3.1" y="-5.8" width="1.5" height="1.5"/><rect x="0.4" y="-5.8" width="1.5" height="1.5"/></g></svg>`;

const activeMaps = {};
const pendingMaps = [];

function buildMap(id, fromKey, toKey, mode, opts){
  opts = opts || {};
  const roundtrip = (opts.roundtrip === true || opts.roundtrip === "true");
  const viaKey = (opts.via && LOCATIONS[opts.via]) ? opts.via : null;
  try{
    // which points to frame + label on this leg's map: the endpoints, any via-stop,
    // and optional extra context points the item lists in `frame` (e.g. all the ports
    // of an island triangle). data- attributes arrive as strings.
    let frame = opts.frame;
    if(typeof frame === "string"){ try{ frame = JSON.parse(frame); }catch(e){ frame = []; } }
    const keys = [...new Set([fromKey, toKey, viaKey, ...(Array.isArray(frame) ? frame : [])]
      .filter(k => k && LOCATIONS[k]))];
    const from = LOCATIONS[fromKey], to = LOCATIONS[toKey];
    let path;
    if(viaKey){
      // real intermediate port (e.g. the ferry calling at Madalena): two segments, each
      // bowed north toward open water so the dashed line never crosses Pico island
      const via = LOCATIONS[viaKey];
      const arc = (a,b,mul)=> curvePoints(a, b, Math.max(Math.abs(b.lon-a.lon), Math.abs(b.lat-a.lat)) * mul, 40);
      path = arc(from, via, 0.08).concat(arc(via, to, 0.05));
    } else {
      const bend = -Math.max(Math.abs(to.lon-from.lon), Math.abs(to.lat-from.lat)) * 0.20;
      path = curvePoints(from, to, bend, 60);
      if(roundtrip){ path = path.concat(curvePoints(to, from, -bend, 60)); }
    }
    const container = document.getElementById('map-'+id);
    if(!container || activeMaps[id]) return;

    const map = L.map(container, {
      zoomControl:false, dragging:false, scrollWheelZoom:false, doubleClickZoom:false,
      boxZoom:false, keyboard:false, tap:false, attributionControl:true
    });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution:'&copy; OpenStreetMap contributors', maxZoom:19
    }).addTo(map);

    const bounds = L.latLngBounds(keys.map(k=>[LOCATIONS[k].lat, LOCATIONS[k].lon]).concat(path));
    map.fitBounds(bounds, {padding:[44,40]});

    // Labels are divIcon markers pinned to the coordinate. A pure-CSS transform offsets
    // the pill by its own width (calc(-100% ...)), so the position is always right —
    // no width measurement, no dependence on when the web font loads. On the wide
    // crossing maps the endpoint dots hug the frame edge, so their label points inward
    // (east dot -> label to its left, west dot -> label to its right); island maps sit on top.
    const wideLeg = Math.abs(to.lon - from.lon) > 8;
    const midLon = (from.lon + to.lon) / 2;
    keys.forEach(k=>{
      const loc = LOCATIONS[k];
      const active = (k===fromKey || k===toKey || k===viaKey);
      L.circleMarker([loc.lat, loc.lon], {
        radius: active?7:5, weight:1.5,
        color: active ? '{{C_INK}}' : '#6E8688',
        fillColor: active ? '{{C_TURQ}}' : '#FFFFFF', fillOpacity:1
      }).addTo(map);
      const side = !wideLeg ? 'top' : (loc.lon >= midLon ? 'left' : 'right');
      L.marker([loc.lat, loc.lon], {
        interactive:false, keyboard:false,
        icon: L.divIcon({
          className:'map-label-icon', iconSize:[0,0], iconAnchor:[0,0],
          html:`<span class="map-label lbl-${side}${active?' active':''}">${loc.label}</span>`
        })
      }).addTo(map);
    });

    L.polyline(path, {color:'{{C_TURQ}}', weight:2.4, dashArray:'5,7', opacity:.9}).addTo(map);

    if(opts.fog && LOCATIONS[opts.fog]){
      const f = LOCATIONS[opts.fog];
      L.marker([f.lat, f.lon], {
        interactive:false, zIndexOffset:1000,
        icon: L.divIcon({ html:'<div class="fog-badge">☁<span>ערפל</span></div>', className:'fog-icon', iconSize:[52,52], iconAnchor:[26,26] })
      }).addTo(map);
    }

    const icon = L.divIcon({ html: mode==='ferry'?FERRY_SVG:PLANE_SVG, className:'veh-icon', iconSize:[32,32], iconAnchor:[16,16] });
    const marker = L.marker(path[0], {icon}).addTo(map);

    activeMaps[id] = {map, marker, path, mode, visible:false, running:false, dur: roundtrip ? 4600 : (viaKey ? 3400 : 2600)};
  } catch(err){
    console.error('map init failed for', id, err);
  }
}

function bearingPx(map, a, b){
  const pa = map.latLngToContainerPoint(a), pb = map.latLngToContainerPoint(b);
  return Math.atan2(pb.y-pa.y, pb.x-pa.x) * 180/Math.PI;
}

function setVehicle(state, frac){
  const {map, marker, path} = state;
  const n = path.length - 1;
  frac = Math.max(0, Math.min(1, frac));
  marker.setLatLng(path[Math.round(frac*n)]);
  const i = Math.min(n-1, Math.floor(frac*n));
  const el = marker.getElement();
  if(!el) return;
  const svg = el.querySelector('.veh-svg');
  if(!svg) return;
  const a = bearingPx(map, path[i], path[i+1]);   // degrees: 0=east, 90=south, 180=west
  if(state.mode === 'ferry'){
    // side-view ship: keep it upright — face left/right, only a gentle tilt for the up/down component
    const rad = a * Math.PI / 180;
    const faceLeft = Math.cos(rad) < 0;
    const tilt = Math.max(-16, Math.min(16, Math.sin(rad) * 16)) * (faceLeft ? -1 : 1);
    svg.style.transform = `scaleX(${faceLeft ? -1 : 1}) rotate(${tilt}deg)`;
  } else {
    svg.style.transform = `rotate(${a}deg)`;
  }
}

// Loops the vehicle along its route for as long as the section stays in view.
function playRoute(id){
  try{
    const state = activeMaps[id];
    if(!state || state.running) return;
    state.running = true;
    const dur = state.dur || 2600;
    const holdStart = 300, holdEnd = 1000;   // brief pauses at origin / destination
    const cycle = holdStart + dur + holdEnd;
    let cycleStart = performance.now();
    function frame(now){
      try{
        if(!state.visible){ state.running = false; setVehicle(state, 0); return; }
        const p = (now - cycleStart) % cycle;
        let frac;
        if(p < holdStart) frac = 0;
        else if(p < holdStart + dur) frac = (p - holdStart) / dur;
        else frac = 1;
        setVehicle(state, frac);
        state.raf = requestAnimationFrame(frame);
      } catch(err){ console.error('route animation failed for', id, err); }
    }
    state.raf = requestAnimationFrame(frame);
  } catch(err){ console.error('playRoute failed for', id, err); }
}

function mapSVG(id, fromKey, toKey, mode){
  // real container for a live Leaflet map — filled in once Leaflet has loaded and the section scrolls into view
  return `<div class="map-wrap"><div class="realmap" id="map-${id}"></div></div>`;
}

  return `
  <section class="transit" data-reveal data-map-id="${id}" data-from="${item.from}" data-to="${item.to}" data-mode="${item.mode}"${item.viaStop ? ` data-via="${item.viaStop}"` : ""}${item.frame ? ` data-frame='${JSON.stringify(item.frame)}'` : ""}>
    <div class="wrap">
      <div class="kicker mono">${kicker}</div>
      <h2>${legHTML(item.stops||[])}</h2>
      <div class="route">${routeLine}</div>
      ${mapSVG(id, item.from, item.to, item.mode)}

function galleryHTML(list, emptyCount, emptyIcon, emptyText, alt){
  if(list && list.length){

  }
  return Array.from({length:emptyCount}).map(()=>`<div class="ph"><div class="icon">${emptyIcon}</div><div>${emptyText}</div></div>`).join("");
}

const app = document.getElementById("app");
app.innerHTML = TIMELINE.map((item, i)=>{
  if(item.type==="transit") return transitHTML(item, i);
  if(item.type==="drama") return dramaHTML(item);
  if(item.type==="day") return dayHTML(item);
  if(item.type==="stay") return stayHTML(item);
  if(item.type==="layover") return layoverHTML(item);
  return "";
}).join("");

/* =========================================================
   SCROLL-TRIGGERED MAP CREATION + ANIMATION + PROGRESS RAIL
   ========================================================= */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    try{
      const mapId = e.target.dataset.mapId;
      const visible = e.isIntersecting && e.intersectionRatio >= 0.2;
      if(e.isIntersecting) e.target.classList.add('in');
      if(!mapId) return;

      if(!visible){
        if(activeMaps[mapId]) activeMaps[mapId].visible = false;
        return;
      }
      if(typeof L === "undefined"){
        setTimeout(()=>{ io.unobserve(e.target); io.observe(e.target); }, 300);
        return;
      }
      if(!activeMaps[mapId]){
        buildMap(mapId, e.target.dataset.from, e.target.dataset.to, e.target.dataset.mode, e.target.dataset);
        setTimeout(()=>{ if(activeMaps[mapId]){ activeMaps[mapId].visible = true; playRoute(mapId); } }, 350);
      } else {
        activeMaps[mapId].visible = true;
        playRoute(mapId);
      }
    } catch(err){ console.error('observer entry failed', err); }
  });
}, {threshold:[0, 0.2, 0.35]});
document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));

window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const pct = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
  document.getElementById('rail-fill').style.height = pct+'%';
});
</script>
