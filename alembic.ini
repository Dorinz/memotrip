# Alembic - schema migrations, one file per change in migrations/versions/.
# The app runs `upgrade head` itself on every startup (db.init_schema()), so
# there's nothing to run by hand. The database URL comes from DATABASE_URL
# (see migrations/env.py), never from this file.
#
#   alembic revision -m "add cover photo to trips"   new migration file
#   alembic current / alembic history                 where a database is
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
